function empty(){return {members:[],mu:0,sessions:[],del:[]}} function normalizeData(d){d=d&&typeof d==='object'?d:{};if(!Array.isArray(d.members))d.members=[];if(!Array.isArray(d.sessions))d.sessions=[];if(!Array.isArray(d.del))d.del=[];if(typeof d.mu!=='number')d.mu=0;d.sessions=d.sessions.filter(s=>s&&typeof s==='object').map(s=>{if(!Array.isArray(s.rows))s.rows=[];return s});return dedupeMembers(d)} function nk(x){return (String(x.nom||'')+'|'+String(x.prenom||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()} function dedupeMembers(d){let seen=new Map(),map={},out=[];d.members.forEach(x=>{if(!x||typeof x!=='object')return;let k=nk(x);if(k.replace('|','')===''){out.push(x);return}let p=seen.get(k);if(!p){seen.set(k,x);out.push(x)}else{map[String(x.id)]=String(p.id);['phone','place'].forEach(f=>{if(!p[f]&&x[f])p[f]=x[f]});if((!p.poste||p.poste==='Aucun service')&&x.poste)p.poste=x.poste}});if(Object.keys(map).length){d.members=out;d.sessions.forEach(s=>{let ids=new Set();s.rows=s.rows.filter(r=>{if(!r)return false;if(map[String(r.memberId)])r.memberId=map[String(r.memberId)];if(ids.has(String(r.memberId)))return false;ids.add(String(r.memberId));return true})})}return d} function load(){try{let k=storageKey(state.committee),v=localStorage.getItem(k);if(v)return normalizeData(JSON.parse(v));let old=localStorage.getItem('smm2'),done=localStorage.getItem('smm2_done')||Object.keys(localStorage).some(x=>x.indexOf('smm2_migrated_')===0);if(old&&!done&&!state.maint&&!state.pastor){localStorage.setItem('smm2_done',k);return normalizeData(JSON.parse(old))}return empty()}catch(e){return empty()}} function save(){if(state.data&&state.committee&&state.committee!=='Pasteur')localStorage.setItem(storageKey(state.committee),JSON.stringify(normalizeData(state.data)))} function mergeData(remote,local){remote=normalizeData(remote);local=normalizeData(local);let members=new Map();remote.members.forEach(x=>members.set(String(x.id),x));local.members.forEach(x=>{let q=members.get(String(x.id));if(q&&q.ru&&q.ru>(x.ru||0))x=Object.assign({},x,{phone:q.phone,place:q.place,ru:q.ru});members.set(String(x.id),x)});let sessions=new Map();remote.sessions.concat(local.sessions).forEach(x=>sessions.set(String(x.id),x));return normalizeData({rv:remote.rv||local.rv,members:Array.from(members.values()),mu:Math.max(remote.mu,local.mu),sessions:Array.from(sessions.values()).filter(s=>!(remote.del.concat(local.del).map(String).includes(String(s.id)))).sort((a,b)=>String(a.date).localeCompare(String(b.date))),del:Array.from(new Set([...(remote.del||[]),...(local.del||[])]))})} function uid(){return Date.now()+'-'+Math.random().toString(36).slice(2,7)} function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
async function api(x){let r=await fetch(URL_API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(x)});let t=await r.text();try{return JSON.parse(t)}catch(e){if(t.trim().startsWith('<!DOCTYPE')||t.trim().startsWith('<html'))throw Error('Le serveur Google Apps Script renvoie une page HTML au lieu des données. Vérifie uniquement le déploiement du script (accès Web App) ; le code de connexion de l’application n’a pas été modifié.');throw Error('Réponse serveur invalide.')}}
const App=window.SMM_APP={};
// ===== Connexion automatique comité / Pasteur =====
App.login=async()=>{let c=document.getElementById('code').value.trim();if(!c)return;document.getElementById('msg').textContent='Connexion...';try{
  let r=await api({a:'login',k:c});if(r&&r.m){state.code=c;state.pastor=false;state.maint=true;document.getElementById('login').style.display='none';document.getElementById('msg').textContent='';App.mtOpen();return}
  if(!r.err){
    state.committee=r.c;state.code=c;state.pastor=false;state.data=load();
    if(!state.data.members.length&&r.c==='Médias')state.data.members=seed.map((n,i)=>{let a=n.split(' ');return{id:'seed-'+i,nom:a[0],prenom:a.slice(1).join(' '),phone:'',place:'',poste:'Aucun service'}});
    localStorage.setItem('smm_committee',r.c);localStorage.setItem('smm_code',c);localStorage.removeItem('smm_role');save();
    document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();await App.sync();return;
  }
  let p=await api({a:'all',k:c});
  if(p.err){let g=await api({a:'eg_get',k:c});if(g.err)throw Error('Code incorrect. Si tu viens de le changer, vérifie que le script est bien déployé en nouvelle version.');state.code=c;state.pastor=false;document.getElementById('login').style.display='none';document.getElementById('msg').textContent='';App.egOpen(g);return}
  state.committee='Pasteur';state.code=c;state.pastor=true;state.all=p.all||{};state.data=empty();
  localStorage.removeItem('smm_committee');localStorage.removeItem('smm_code');localStorage.setItem('smm_role','pastor');
  document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';initPastor();
}catch(e){document.getElementById('msg').textContent=e.message||'Connexion impossible'}};

App.sync=async()=>{if(!state.committee||state.committee==='Pasteur')return;try{state.data=normalizeData(state.data);save();let local=JSON.parse(JSON.stringify(state.data));let r=await api({c:state.committee,k:state.code,data:local});if(r.err){if(/Code incorrect/.test(r.err))return App.codeChanged();throw Error(r.err)}if(r.rv&&r.rv!==local.rv){state.data=normalizeData(r);if(state.committee==='Médias'&&!state.data.members.length&&!/^R/.test(r.rv))state.data.members=seed.map((n,i)=>{let a=n.split(' ');return{id:'seed-'+i,nom:a[0],prenom:a.slice(1).join(' '),phone:'',place:'',poste:'Aucun service'}})}else state.data=mergeData(r,local);state.data.mu=Math.max(state.data.mu,Date.now());save();render();toast('Synchronisation réussie · copie locale conservée')}catch(e){save();toast('Synchronisation impossible · données conservées sur le téléphone')}};
App.toggleMenu=()=>{document.querySelector('.side').classList.toggle('open');document.getElementById('menuShade').classList.toggle('show')};App.closeMenu=()=>{document.querySelector('.side').classList.remove('open');document.getElementById('menuShade').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')App.closeMenu()});function init(){document.getElementById('committee').textContent=state.committee;buildNav();render()} function buildNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${state.tab===n[0]?'active':''}" onclick="App.go('${n[0]}')">${IC({home:'home',members:'users',attendance:'chk',history:'hist',stats:'bar',reports:'clip',settings:'set'}[n[0]])}<span>${n[2]}</span></button>`).join('')} App.go=t=>{state.tab=t;App.closeMenu();buildNav();document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.getElementById('title').textContent=NAV.find(x=>x[0]===t)[2];render()};
function render(){renderHome();renderMembers();renderAttendance();renderHistory();renderStats();renderReports();renderSettings()}

function absenceCounts(d){let out={};(d.members||[]).forEach(m=>out[m.id]=0);(d.sessions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(s=>(s.rows||[]).forEach(r=>{if(r.present===false&&Object.prototype.hasOwnProperty.call(out,r.memberId))out[r.memberId]++}));return out}
function mStatus(d,id){let rows=[];(d.sessions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(s=>(s.rows||[]).forEach(r=>{if(String(r.memberId)===String(id)&&typeof r.present==='boolean')rows.push({m:String(s.date||'').slice(0,7),p:r.present})}));if(!rows.length)return 'none';let t=new Date(),f=(y,mo)=>y+'-'+String(mo+1).padStart(2,'0'),cur=f(t.getFullYear(),t.getMonth()),pv=new Date(t.getFullYear(),t.getMonth()-1,1),prev=f(pv.getFullYear(),pv.getMonth()),pa=rows.filter(x=>x.m===prev&&!x.p).length,base=pa>=3?'red':pa===2?'orange':'plain',st=0;for(let i=rows.length-1;i>=0&&!rows[i].p;i--)st++;let inCur=rows.filter(x=>x.m===cur);if(inCur.length){if(inCur[inCur.length-1].p)return 'ok';return(st>=2||inCur.filter(x=>!x.p).length>=3||base==='red')?'red':base}if(base!=='plain')return base;return st>=2?'red':'plain'} function stCls(s){return s==='red'?'st-red':s==='orange'?'st-orange':s==='ok'?'st-ok':''} function memberFrequency(d){d=normalizeData(d);return d.members.map(m=>{let rows=d.sessions.flatMap(s=>(s.rows||[]).filter(r=>String(r.memberId)===String(m.id)));let abs=rows.filter(r=>r.present===false).length,pres=rows.filter(r=>r.present===true).length,total=abs+pres;return {m,st:mStatus(d,m.id),abs,pres,total,absenceRate:total?Math.round(abs/total*100):0,presenceRate:total?Math.round(pres/total*100):0}}).sort((a,b)=>b.absenceRate-a.absenceRate||b.abs-a.abs);}
function frequencyTable(d){let list=memberFrequency(d);if(!list.length)return '<p class="muted">Aucun membre enregistré.</p>';return `<div style="overflow:auto"><table><thead><tr><th>Membre</th><th>Présences</th><th>Absences</th><th>Séances comptées</th><th>% présence</th><th>% absence</th><th>Signal</th></tr></thead><tbody>${list.map(x=>`<tr class="${x.st==='red'?'risk-row':''}"><td><b class="${stCls(x.st)}">${esc(x.m.nom)} ${esc(x.m.prenom)} ${x.st==='red'?'⚠':''}</b></td><td>${x.pres}</td><td>${x.abs}</td><td>${x.total}</td><td>${x.presenceRate}%</td><td class="${x.st==='red'?'rate-bad':''}">${x.absenceRate}%</td><td>${x.st==='red'?'<span class="pill" style="background:#fee2e2;color:#991b1b">Suivi particulier</span>':x.st==='orange'?'<span class="pill" style="background:#ffedd5;color:#9a3412">À surveiller</span>':x.st==='ok'?'<span class="pill" style="background:#dcfce7;color:#166534">Présent</span>':'<span class="pill">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;}
function chartSvg(d,title='Fréquentation par séance'){
 let sessions=(d.sessions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 if(!sessions.length)return `<div class="card"><h3>${esc(title)}</h3><p class="muted">Les courbes apparaîtront après les premiers pointages enregistrés.</p></div>`;
 let W=Math.max(360,sessions.length*72+60),H=220,L=38,R=14,T=18,B=45,iw=W-L-R,ih=H-T-B,max=Math.max(1,...sessions.map(s=>(s.rows||[]).length));
 let ptsP=[],ptsA=[],bars='',labels='';
 sessions.forEach((s,i)=>{let rows=s.rows||[],p=rows.filter(r=>r.present).length,a=rows.filter(r=>r.present===false).length,x=L+(i+.5)*iw/sessions.length,yp=T+ih-(p/max)*ih,ya=T+ih-(a/max)*ih,bw=Math.min(22,iw/sessions.length*.24);ptsP.push(`${x},${yp}`);ptsA.push(`${x},${ya}`);bars+=`<rect x="${x-bw-2}" y="${T+ih-(p/max)*ih}" width="${bw}" height="${p/max*ih}" rx="3" fill="#16a34a" opacity=".8"><title>${esc(s.date)} : ${p} présents</title></rect><rect x="${x+2}" y="${T+ih-(a/max)*ih}" width="${bw}" height="${a/max*ih}" rx="3" fill="#dc2626" opacity=".75"><title>${esc(s.date)} : ${a} absents</title></rect>`;labels+=`<text x="${x}" y="${H-18}" font-size="10" text-anchor="middle" fill="currentColor">${esc(String(s.date||'').slice(5))}</text>`});
 let grid='';for(let i=0;i<=4;i++){let y=T+ih-i*ih/4;grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="${L-8}" y="${y+4}" font-size="10" text-anchor="end" fill="currentColor">${Math.round(max*i/4)}</text>`}
 return `<div class="card chart-wrap"><h3>${esc(title)}</h3><svg class="attendance-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Présences et absences par séance">${grid}${bars}<polyline points="${ptsP.join(' ')}" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${ptsA.join(' ')}" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${ptsP.map(v=>{let a=v.split(',');return `<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="#15803d"/>`}).join('')}${ptsA.map(v=>{let a=v.split(',');return `<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="#dc2626"/>`}).join('')}${labels}</svg><div class="chart-legend"><span><i class="legend-dot" style="background:#16a34a"></i>Présents (barres + courbe)</span><span><i class="legend-dot" style="background:#dc2626"></i>Absents (barres + courbe)</span></div></div>`
}
function renderMembers(){state.data=normalizeData(state.data);let m=state.data.members,media=state.committee==='Médias',abs=absenceCounts(state.data);document.getElementById('members').innerHTML=`<div class="head"><h2>Personnel · ${esc(state.committee)}</h2><button class="btn primary" onclick="App.member()">+ Ajouter</button></div><div class="card"><input placeholder="Rechercher..." oninput="App.filter(this.value)"></div><div class="card" style="margin-top:14px" id="mt">${memberTable(m,media,abs)}</div>`} function memberTable(m,media,abs=absenceCounts(state.data)){if(!m.length)return '<p class="muted">Aucun membre.</p>';return m.map(x=>{let n=abs[x.id]||0,w=n>=2,tel=esc(x.phone||'');return `<div style="border-top:1px solid rgba(128,128,128,.22)"><div onclick="App.toggleM('${x.id}')" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;cursor:pointer"><b class="${w?'warning-name':''}">${esc(x.nom)} ${esc(x.prenom)}${w?' ⚠':''}</b><span class="muted" id="ch-${x.id}">▾</span></div><div id="md-${x.id}" hidden style="padding:0 2px 14px"><div style="line-height:1.9"><span class="muted">📞 Téléphone :</span> ${tel?`<a href="tel:${tel}">${tel}</a>`:'Non renseigné'}<br><span class="muted">📍 Lieu :</span> ${esc(x.place)||'Non renseigné'}${media?`<br><span class="muted">🎯 Poste :</span> ${esc(x.poste||'Aucun service')}`:''}<br><span class="muted">📉 Absences :</span> ${n}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="App.member('${x.id}')">Modifier</button></div></div></div>`}).join('')} App.toggleM=id=>{let d=document.getElementById('md-'+id);if(!d)return;let o=d.hidden;document.querySelectorAll('[id^="md-"]').forEach(e=>{e.hidden=true});document.querySelectorAll('[id^="ch-"]').forEach(e=>e.textContent='▾');if(o){d.hidden=false;let c=document.getElementById('ch-'+id);if(c)c.textContent='▴'}}; App.filter=q=>{let m=state.data.members.filter(x=>(x.nom+' '+x.prenom+' '+x.phone+' '+x.place).toLowerCase().includes(q.toLowerCase()));document.getElementById('mt').innerHTML=memberTable(m,state.committee==='Médias',absenceCounts(state.data))};
App.member=id=>{let x=id?state.data.members.find(a=>a.id===id):{id:'',nom:'',prenom:'',phone:'',place:'',poste:'Aucun service'},media=state.committee==='Médias';document.getElementById('modal').innerHTML=`<div class="head"><h2>${id?'Modifier':'Ajouter'} un membre</h2><button class="btn" onclick="App.close()">×</button></div><div class="grid g2"><div class="field"><label>Nom</label><input id="fn" value="${esc(x.nom)}"></div><div class="field"><label>Prénom</label><input id="fp" value="${esc(x.prenom)}"></div></div><div class="grid g2"><div class="field"><label>Numéro de téléphone</label><input id="ft" value="${esc(x.phone)}"></div><div class="field"><label>Lieu d’habitation</label><input id="fl" value="${esc(x.place)}"></div></div>${media?`<div class="field"><label>Poste</label><select id="fo">${POSTS.map(p=>`<option ${x.poste===p?'selected':''}>${p}</option>`).join('')}</select></div>`:''}<div class="actions"><button class="btn" onclick="App.close()">Annuler</button>${id?`<button class="btn bad" onclick="App.delMember('${id}')">Supprimer</button>`:''}<button class="btn primary" onclick="App.saveMember('${id||''}')">Enregistrer</button></div>`;openModal()};
App.saveMember=id=>{let x={id:id||uid(),nom:document.getElementById('fn').value.trim(),prenom:document.getElementById('fp').value.trim(),phone:document.getElementById('ft').value.trim(),place:document.getElementById('fl').value.trim()};if(!x.nom&&!x.prenom)return toast('Indique le nom ou le prénom.');if(state.committee==='Médias')x.poste=document.getElementById('fo').value;let i=state.data.members.findIndex(a=>a.id===x.id);if(i<0)state.data.members.push(x);else state.data.members[i]=x;state.data.mu=Date.now();save();App.close();render();App.sync()};App.delMember=id=>{if(confirm('Supprimer ce membre ?')){state.data.members=state.data.members.filter(x=>x.id!==id);state.data.mu=Date.now();save();App.close();render();App.sync()}};
function rows(){let cur=state.rows||[];state.rows=state.data.members.map(x=>cur.find(r=>r.memberId===x.id)||{memberId:x.id,present:true,service:NS()?'':'Non servi',reason:''});return state.rows} function renderAttendance(){state.data=normalizeData(state.data);let m=state.data.members,rr=rows(),media=state.committee==='Médias',absCounts=absenceCounts(state.data),stt={};m.forEach(x=>stt[x.id]=mStatus(state.data,x.id));state.rows=rr;document.getElementById('attendance').innerHTML=`<div class="head"><h2>Fiche de pointage</h2><div class="actions"><button class="btn ok" onclick="App.pres(true)">Tout présent</button><button class="btn bad" onclick="App.pres(false)">Tout absent</button>${NS()?'':`<button class="btn ok" onclick="App.serv(true)">Tous servis</button><button class="btn bad" onclick="App.serv(false)">Tous non servis</button>`}</div></div><div class="card"><div class="grid g2"><div class="field"><label>Date</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Activité</label><input id="aa" value="Culte du dimanche"></div></div><div style="overflow:auto"><table><thead><tr><th>Membre</th><th>Présence</th>${NS()?'':'<th>Service</th>'}${media?'<th>Poste</th>':''}<th>Motif</th></tr></thead><tbody>${m.map(x=>{let r=rr.find(a=>a.memberId===x.id)||{present:true,service:'Non servi',reason:''};return `<tr><td><b class="${stCls(stt[x.id])}">${esc(x.nom)} ${esc(x.prenom)}${stt[x.id]==='red'?' ⚠':''}</b><br><span class="muted">${esc(x.phone)}</span></td><td><button class="btn ${r.present?'ok':'bad'}" onclick="App.toggleP('${x.id}')">${r.present?'Présent':'Absent'}</button></td>${NS()?'':`<td><button class="btn ${r.service==='Servi'?'ok':'bad'}" onclick="App.toggleS('${x.id}')">${r.service}</button></td>`}${media?`<td>${esc(x.poste||'Aucun service')}</td>`:''}<td><select onchange="App.reason('${x.id}',this.value)" ${r.present?'disabled':''}>${REASONS.map(a=>`<option ${r.reason===a?'selected':''}>${a}</option>`).join( App.tour=(steps,done)=>{let i=0,o=document.createElement('div');o.id='tour';o.style.cssText='position:fixed;inset:0;z-index:1100';o.innerHTML='<div id="tspot" style="position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.68);border:2px solid var(--acc);transition:all .3s"></div><div id="ttip" class="card" style="position:absolute;left:14px;right:14px;padding:14px;background:var(--bg1);max-width:480px;margin:0 auto"></div>';document.body.appendChild(o);

const idbP=()=>new Promise((res,rej)=>{let q=indexedDB.open('bcnta',1);q.onupgradeneeded=()=>q.result.createObjectStore('snap');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function idbSet(k,v){try{let d=await idbP();d.transaction('snap','readwrite').objectStore('snap').put(v,k)}catch(e){}}
async function idbGet(k){try{let d=await idbP();return await new Promise(r=>{let q=d.transaction('snap').objectStore('snap').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

function bkBanner(){let d=state.data;if(!d||!(d.members||[]).length)return '';let lf=+localStorage.getItem('smm_lastfile')||0,ds=+localStorage.getItem('smm_bkdismiss')||0,n=Date.now();if(n-lf<7*864e5||n-ds<864e5)return '';return `<div class="card" style="margin:6px 0 0;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1;min-width:180px">💾 Pense à enregistrer une copie de tes données sur ton téléphone.</span><button class="btn primary" onclick="App.localSave()">Enregistrer</button><button class="btn" onclick="localStorage.setItem('smm_bkdismiss',String(Date.now()));render()">Plus tard</button></div>`}
function report(sid){
  state.data=normalizeData(state.data);
  let s=sid?state.data.sessions.find(x=>String(x.id)===String(sid)):state.data.sessions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
  if(!s)return 'Aucun pointage enregistré.';
  let m=state.data.members||[], by=id=>m.find(x=>x.id===id)||{};
  let rows=Array.isArray(s.rows)?s.rows:[];
  let present=rows.filter(r=>r.present), abs=rows.filter(r=>!r.present), served=rows.filter(r=>r.service==='Servi');
  let line='━━━━━━━━━━━━━━━━━━━━';
  let out=`📋 *RAPPORT DE POINTAGE — ${s.committee||state.committee}*\n${line}\n\n`;
  out+=`📅 *Date :* ${s.date||'Non précisée'}\n🎯 *Activité :* ${s.activity||'Non précisée'}\n👥 *Nombre de membres :* ${m.length}\n\n`;
  out+=`👥 *LISTE DES MEMBRES (${m.length})*\n\n`;
  m.forEach((x,i)=>{
    out+=`🔹 *MEMBRE ${i+1} : ${[x.nom,x.prenom].filter(Boolean).join(' ')||'Nom non renseigné'}*\n`;
    out+=`   📞 Téléphone : ${x.phone||'Non renseigné'}\n`;
    out+=`   📍 Habitation : ${x.place||'Non renseignée'}\n`;
    if((s.committee||state.committee)==='Médias')out+=`   🛠 Poste : ${x.poste||'Aucun service'}\n`;
    out+='\n';
  });
  out+=`${line}\n✅ *PRÉSENTS (${present.length})*\n\n`;
  if(!present.length)out+='Aucun membre présent.\n\n';
  present.forEach((r,i)=>{
    let x=by(r.memberId);
    out+=`✅ *${i+1}. ${[x.nom,x.prenom].filter(Boolean).join(' ')||'Nom non renseigné'}*\n`;
    out+=`   • État : Présent\n`;
    if(!NS(s))out+=`   • Service : ${r.service||'Non renseigné'}\n`;
    if((s.committee||state.committee)==='Médias')out+=`   • Poste : ${x.poste||'Aucun service'}\n`;
    out+='\n';
  });
  out+=`${line}\n❌ *ABSENTS (${abs.length})*\n\n`;
  if(!abs.length)out+='Aucun membre absent.\n\n';
  abs.forEach((r,i)=>{
    let x=by(r.memberId);
    out+=`❌ *${i+1}. ${[x.nom,x.prenom].filter(Boolean).join(' ')||'Nom non renseigné'}*\n`;
    if((s.committee||state.committee)==='Médias')out+=`   • Poste : ${x.poste||'Aucun service'}\n`;
    out+=`   • Motif : ${r.reason||'Non précisé'}\n\n`;
  });
  out+=`${line}\n📊 *RÉSUMÉ DU POINTAGE*\n`;
  out+=`• Présents : ${present.length}\n• Absents : ${abs.length}\n${NS(s)?'':`• Servis : ${served.length}/${rows.length}\n`}• Taux de présence : ${rows.length?Math.round(present.length/rows.length*100):0}%\n`;
  return out;
}

function pastorCounts(d){let s=d.sessions||[],m=d.members||[],last=s.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0],rows=last&&Array.isArray(last.rows)?last.rows:[];let total=rows.length,present=rows.filter(r=>r.present).length,absent=rows.filter(r=>r.present===false).length;return {members:m.length,sessions:s.length,present,absent,served:rows.filter(r=>r.service==='Servi').length,presenceRate:total?Math.round(present/total*100):0,absenceRate:total?Math.round(absent/total*100):0,last:last}}
function renderPastor(){
  let totals=COM.map(c=>{let d=pastorData(c);return {c,d,k:pastorCounts(d)}}),members=totals.reduce((a,x)=>a+x.k.members,0),sessions=totals.reduce((a,x)=>a+x.k.sessions,0),allData=normalizeData({members:totals.flatMap(x=>x.d.members),sessions:totals.flatMap(x=>x.d.sessions)}),allRows=allData.sessions.flatMap(x=>x.rows||[]),allP=allRows.filter(r=>r.present).length,allA=allRows.filter(r=>r.present===false).length;
  document.getElementById('title').textContent='Vision du Pasteur';
  document.getElementById('home').classList.add('active');document.querySelectorAll('.view:not(#home)').forEach(x=>x.classList.remove('active'));
  document.getElementById('home').innerHTML=`<div class="head"><div><h2 style="margin:0">Vision du Pasteur</h2><p class="muted">Vue d’ensemble des six comités</p></div><span class="pill blue">Lecture seule</span></div><div class="grid g4"><div class="card stat"><span class="muted">Comités</span><b>${COM.length}</b></div><div class="card stat"><span class="muted">Membres</span><b>${members}</b></div><div class="card stat"><span class="muted">Séances</span><b>${sessions}</b></div><div class="card stat"><span class="muted">Présences / absences</span><b>${allP} / ${allA}</b></div><div class="card stat"><span class="muted">Dernière synchronisation</span><b style="font-size:16px">À jour</b></div></div>${bandsCards(totals)}${statKit(allData.sessions,[],'#2563eb',1)}<div class="card" style="margin-top:15px"><h3>Alertes de fréquentation — tous les comités</h3>${frequencyTable(allData)}</div><div class="head" style="margin-top:25px"><h2>Comités</h2></div><div class="grid g2">${totals.map(x=>`<div class="card"><div class="head"><h3 style="margin:0">${esc(x.c)}</h3><span class="pill blue">${x.k.members} membre${x.k.members>1?'s':''}</span></div><div class="grid g4"><div><span class="muted">Séances</span><b>${x.k.sessions}</b></div><div><span class="muted">Présents</span><b>${x.k.present}</b></div><div><span class="muted">Absents</span><b>${x.k.absent}</b></div><div><span class="muted">Servis</span><b>${x.k.served}</b></div></div><p class="muted">Présence : ${x.k.presenceRate}% · Absence : ${x.k.absenceRate}%</p><button class="btn primary" style="margin-top:15px" onclick="App.pastorCommittee('${x.c}')">Voir le comité</button></div>`).join('')}</div>`;
}
App.pastorHome=()=>{state.tab='home';App.closeMenu();document.getElementById('title').textContent='Vision du Pasteur';renderPastor()};
App.pastorCommittee=c=>{App.closeMenu();let d=pastorData(c),k=pastorCounts(d),media=c==='Médias';state.pastorView=c;document.getElementById('title').textContent=c;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('home').classList.add('active');document.getElementById('home').innerHTML=`<div class="head"><div><h2 style="margin:0">${esc(c)}</h2><p class="muted">Vision Pasteur · consultation uniquement</p></div><button class="btn" onclick="App.pastorHome()">← Tous les comités</button></div><div class="grid g4"><div class="card stat"><span class="muted">Membres</span><b>${k.members}</b></div><div class="card stat"><span class="muted">Séances</span><b>${k.sessions}</b></div><div class="card stat"><span class="muted">Présents dernière séance</span><b>${k.present}</b></div><div class="card stat"><span class="muted">Servis dernière séance</span><b>${k.served}</b></div><div class="card stat"><span class="muted">Taux de présence</span><b>${k.presenceRate}%</b></div><div class="card stat"><span class="muted">Taux d’absence</span><b>${k.absenceRate}%</b></div></div>${statKit(d.sessions,d.members,CCOL[c]||'#2563eb')}<div class="card" style="margin-top:15px"><h3>Statistiques individuelles et absences</h3><p class="muted">Les membres ayant au moins deux absences sont signalés en rouge.</p>${frequencyTable(d)}</div><div class="card" style="margin-top:15px"><h3>Personnel</h3>${d.members.length?`<div style="overflow:auto"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Lieu</th>${media?'<th>Poste</th>':''}</tr></thead><tbody>${d.members.map(x=>`<tr><td><b>${esc(x.nom)} ${esc(x.prenom)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.place)}</td>${media?`<td>${esc(x.poste||'Aucun service')}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aucun membre enregistré.</p>'}</div><div class="card" style="margin-top:15px"><h3>Historique des pointages</h3>${d.sessions.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Activité</th><th>Présents</th><th>Servis</th></tr></thead><tbody>${d.sessions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.activity)}</td><td>${(s.rows||[]).filter(r=>r.present).length}/${(s.rows||[]).length}</td><td>${(s.rows||[]).filter(r=>r.service==='Servi').length}/${(s.rows||[]).length}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aucun pointage enregistré.</p>'}</div>`};
